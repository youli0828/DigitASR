[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digit-asr"
version = "0.1.0"
description = "A reproducible Chinese isolated spoken digit recognition toolbox"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "numpy>=1.24", "scipy>=1.10", "librosa>=0.10", "soundfile>=0.12",
  "scikit-learn>=1.3", "joblib>=1.3",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
demo = ["gradio>=5,<7"]
dev = ["pytest>=8", "ruff>=0.9"]
data = ["espeakng-loader==0.2.4"]
plots = ["matplotlib>=3.8"]

[project.scripts]
digit-asr = "digit_asr.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
